name: Feature request
description: Предложить новую возможность или улучшение
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Опишите задачу, а не готовое решение. Крупные изменения лучше сначала
        обсудить в issue.

  - type: textarea
    id: problem
    attributes:
      label: Какую проблему это решает
      placeholder: Игрок не может ..., поэтому ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
      description: Как это могло бы работать со стороны игрока
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Что ещё рассматривали и почему не подходит
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Влияние на баланс и сервер
      description: Меняет ли экономику, RLS или требует новой миграции
    validations:
      required: false
